<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agent Dock">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<title>Agent Dock</title>
<style>
  :root { --bg: #14161b; --card: #1b1e25; --line: rgba(255,255,255,.08); --text: #f2f3f5; --muted: #8b919c; --working: #5aa9ff; --waiting: #ffb020; --done: #3ddc97; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); }
  body { font: 15px/1.35 -apple-system, "SF Pro Text", "PingFang SC", "Segoe UI", system-ui, sans-serif; padding: env(safe-area-inset-top) 0 calc(20px + env(safe-area-inset-bottom)); min-height: 100vh; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; text-align: left; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(20,22,27,.94); backdrop-filter: blur(12px); padding: 10px 14px 8px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); min-height: 52px; }
  header h1 { font-size: 20px; font-weight: 700; }
  header .sub { color: var(--muted); font-size: 12.5px; flex: 1; }
  header .btn { padding: 7px 13px; }
  #toast { position: fixed; left: 14px; right: 14px; top: calc(62px + env(safe-area-inset-top)); z-index: 9; background: #2a2e38; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 14px; display: none; }
  main { padding: 12px 14px 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-content: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .grow { flex: 1; min-width: 0; }
  .name { font-weight: 650; font-size: 16px; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { font-size: 12px; font-weight: 650; padding: 4px 10px; border-radius: 999px; white-space: nowrap; flex: none; }
  .chip.working { color: var(--working); background: rgba(90,169,255,.15); }
  .chip.waiting { color: var(--waiting); background: rgba(255,176,32,.17); }
  .chip.done { color: var(--done); background: rgba(61,220,151,.14); }
  .logo { display: inline-flex; flex: none; }
  .logo svg { width: 100%; height: 100%; display: block; }
  .chatrow { display: flex; align-items: center; gap: 12px; padding: 11px 14px; width: 100%; }
  .chatrow .unread { width: 9px; height: 9px; border-radius: 50%; background: var(--done); flex: none; }
  .ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
  .ask { margin: 0 12px 12px; padding: 12px; border-radius: 14px; background: rgba(255,176,32,.09); border: 1px solid rgba(255,176,32,.25); }
  .ask .q { font-weight: 650; }
  .ask .recap { color: var(--muted); font-size: 13.5px; margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 14em; overflow-y: auto; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .btn { padding: 9px 14px; border-radius: 10px; background: rgba(255,255,255,.1); font-size: 14px; }
  .btn:active { background: rgba(255,255,255,.2); }
  .btn.primary { background: var(--waiting); color: #1a1405; font-weight: 650; }
  .btn:disabled, input:disabled, select:disabled { opacity: .45; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row input { flex: 1; min-width: 0; font-size: 16px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.3); outline: none; }
  .row input:focus, textarea:focus { border-color: rgba(255,176,32,.6); }
  .note { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .note.bad { color: #ff9b8f; } .note.ok { color: var(--done); }
  .empty, .center { color: var(--muted); text-align: center; padding: 40px 20px; }
  .center h2 { color: var(--text); font-size: 18px; margin-bottom: 8px; }
  select, textarea { font-size: 16px; color: var(--text); background: rgba(0,0,0,.3); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; outline: none; }
  .row select { flex: 1; min-width: 0; }
  textarea { margin-top: 10px; resize: vertical; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.07); color: var(--muted); font-size: 13px; white-space: nowrap; flex: none; }
  .fchip.on { background: rgba(255,255,255,.17); color: var(--text); }
  .agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin-top: 10px; }
  .agentbtn { display: grid; justify-items: center; gap: 6px; padding: 10px 6px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid transparent; font-size: 13px; text-align: center; }
  .agentbtn.on { border-color: var(--waiting); background: rgba(255,176,32,.12); }
  .chathead { display: flex; align-items: center; gap: 10px; position: sticky; top: 52px; z-index: 4; background: var(--bg); padding: 4px 0 6px; }
  .msgs { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .msg { padding: 10px 13px; border-radius: 14px; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 92%; line-height: 1.4; }
  .msg.user { justify-self: end; background: rgba(255,176,32,.16); border: 1px solid rgba(255,176,32,.28); }
  .msg.assistant { justify-self: start; background: var(--card); border: 1px solid var(--line); }
  .msg.tool { justify-self: start; background: none; color: var(--muted); font: 12px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace; padding: 2px 4px; max-width: 100%; }
  .msg.working { justify-self: start; color: var(--working); background: rgba(90,169,255,.1); font-size: 13px; padding: 6px 12px; }
  main.inchat { padding-bottom: 230px; }
  .composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(20,22,27,.97); border-top: 1px solid var(--line); padding: 8px 14px calc(10px + env(safe-area-inset-bottom)); }
  .composer textarea { margin-top: 4px; min-height: 52px; max-height: 30vh; }
  .composer .row { margin-top: 8px; min-width: 0; }
  .composer .row > * { min-width: 0; }
  .composer .row select { font-size: 14px; padding: 8px; }
  .composer .btn { flex: none; }
  .composer .ask { margin: 0 0 8px; max-height: 38vh; overflow-y: auto; }
</style>
</head>
<body>
<header><h1 id="title">Agent Dock</h1><span class="sub" id="sub"></span><button class="btn" id="bell" style="display:none;padding:7px 11px;font-size:16px"></button><button class="btn primary" id="newbtn" style="display:none"></button></header><div id="toast" role="status"></div>
<main id="main"></main>
<script src="/mascots.js"></script>
<script>

const I18N = {

    send: '发送', finished: '已完成', noReply: '不回复', replyPlaceholder: '给 Agent 回复…', dismiss: '忽略', placeholder: '输入回答…', sent: '已发送', failed: '未发送', loading: '加载中…',

    newChat: '新建', newTitle: '新对话', back: '返回', start: '开始', stop: '停止', folder: '文件夹', model: '模型', effort: '思考', modelDefault: '默认模型', effortDefault: '默认思考',
    all: '全部', noChats: '这里还没有内容', noMessages: '还没有消息', noFolders: '还没有允许的文件夹。请在电脑上的 Dock 设置里添加。', typing: '正在回复…', live: '电脑上打开',
    forkNote: '这个对话在电脑上打开着：你的消息会在一个副本里继续。', loadMore: '加载更多', older: '更早的消息', typeMsg: '发消息…', promptPh: '让 Agent 做什么？', lastFailed: '上一轮失败', historyOnly: '这个 Agent 在手机上只能查看，不能发消息。',
    insecure2: '请通过 Tailscale 地址打开这个页面才能发消息。', readOnly: '电脑上没开启完全权限时，这个 Agent 是只读的。', pickAgent: 'Agent', chatsOff: 'Dock 设置里关闭了对话功能。',
    chatErr: { disabled: 'Dock 里关闭了手机上的对话。', insecure: '请通过 Tailscale 地址打开这个页面才能使用对话。', folder: '这个文件夹不在允许列表里。', outside: '要在允许文件夹之外继续对话，请在电脑上打开完全权限。', busy: '这个对话或电脑正忙。', live: '这个对话正在电脑上使用，请几分钟后再试。', model: '这个模型或思考档位不可用。', prompt: '内容为空或太长。', 'not installed': '电脑上没有安装这个 Agent。', 'not found': '找不到这个对话。', offline: '连不上电脑。', agent: '这个 Agent 还不能从手机发起对话。' },
    unpaired: '还没有配对', unpairedText: '在电脑上打开 Agent Dock 的设置，点「配对手机」，用相机扫描二维码。',
    pushOnMsg: '开启通知', pushOffMsg: '关闭通知', pushOnDone: '这台手机的通知已开启。', pushOffDone: '这台手机的通知已关闭。', pushDenied: '这个页面的通知被禁止了，请在手机设置里允许。', pushUnsupported: '这个浏览器不能接收通知。', pushNeedsHome: 'iPhone 需要先把这个页面添加到主屏幕，再从主屏幕图标打开，才能开启通知。', pushFailed: '没能开启通知。',
    pairing: '正在配对…', pairFailed: '配对码已过期或已用过。请在电脑上重新点「配对手机」。', offline: '连不上电脑。', retry: '重试',
  },
};
const lang = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
document.documentElement.lang = lang;
const t = (k, ...a) => { const v = I18N[lang][k]; return typeof v === 'function' ? v(...a) : v; };

// a tiny element builder: text is always set as text, never as HTML
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style') el.style.cssText = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const $ = (id) => document.getElementById(id);
// The agent's bot (from mascots.js, drawn from constants there) parsed as SVG, not inserted as HTML.
function logo(id, px = 36) {
  const safe = /^[a-z0-9_-]{1,24}$/.test(String(id)) ? String(id) : 'x';
  const doc = new DOMParser().parseFromString(logoSvg(safe, px), 'image/svg+xml');
  const w = h('span', { class: 'logo', style: `width:${px}px;height:${px}px` });
  w.append(document.importNode(doc.documentElement, true));
  return w;
}
function since(ms) {
  const m = Math.floor((Date.now() - ms) / 60000);
  if (m < 1) return t('now');
  const v = m < 60 ? t('min', m) : m < 1440 ? t('hour', Math.floor(m / 60)) : t('day', Math.floor(m / 1440));
  return lang === 'zh' ? v + t('ago') : v + ' ' + t('ago');
}
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem('dock.' + k)); return v == null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('dock.' + k, JSON.stringify(v)); } catch {} },
};

let state = null; // last /api/state
let chats = null; // last /api/chats ({ ok:false } when chats are off)
let view = { mode: 'home' }; // home | new | chat { key, task, agent }
let chatData = null; // last /api/chat
let listLimit = 40;
let chatLimit = 40;
let filter = 'all';
let pendingMsg = null; // the message just sent, shown until the transcript has it
let composerText = '';
const newDraft = { agent: 'claude', dir: '', text: '' };
const picks = store.get('picks', {});
const drafts = new Map();
let busy = false;
let lastSig = '';

async function api(path, body) {
  const r = await fetch(path, body === undefined ? { cache: 'no-store' } : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), cache: 'no-store' });
  let json = null;
  try { json = await r.json(); } catch {}
  return { status: r.status, json };
}
const errMsg = (r) => {
  const j = r.json || {};
  const key = r.status === 403 && j.error === 'insecure' ? 'insecure' : j.error;
  return t('chatErr')[key] || t('failed') + (key ? ' · ' + key : '');
};
const chatsOn = () => !!(state && state.features && state.features.tasks);
const agentName = (id) => {
  const a = chats && chats.ok && (chats.options.agents || []).find((x) => x.id === id);
  if (a) return a.name;
  const r = state && (state.rows || []).find((x) => x.id === id);
  return r ? r.name : id;
};

// ------------------------------------------------------------------ pairing
async function pairFromUrl() {
  const m = /(?:^|[#&])c=([\w-]+)/.exec(location.hash || '');
  if (!m) return false;
  $('main').replaceChildren(h('div', { class: 'center' }, t('pairing')));
  const label = /iPad/.test(navigator.userAgent) ? 'iPad' : /iPhone/.test(navigator.userAgent) ? 'iPhone' : /Android/.test(navigator.userAgent) ? 'Android' : 'Phone';
  const r = await api('/api/pair', { code: m[1], label });
  history.replaceState(null, '', '/');
  if (r.status === 200) return false;
  $('main').replaceChildren(h('div', { class: 'center' }, h('h2', null, t('unpaired')), t('pairFailed')));
  return true;
}

// ------------------------------------------------------------------ questions (answer / dismiss)
function noteFor(card, features, secure, agentId) {
  if (agentId !== 'claude') return t('noChannel');
  if (!features.answer) return t('disabled');
  if (!secure) return t('insecure');
  if (card.note === 'not-installed') return t('notInstalled');
  if (card.note === 'not-loaded') return t('notLoaded');
  return '';
}
async function doAnswer(card, el, body) {
  if (el.dataset.busy) return;
  el.dataset.busy = '1';
  el.querySelectorAll('button,input').forEach((x) => { x.disabled = true; });
  const r = await api('/api/answer', { sessionId: card.sid, askId: card.aid, ...(card.kind === 'reply' ? { kind: 'reply' } : {}), ...body });
  const ok = r.status === 200 && r.json && r.json.ok;
  if (ok) drafts.delete(card.aid);
  else {
    delete el.dataset.busy;
    el.querySelectorAll('button,input').forEach((x) => { x.disabled = false; });
  }
  let n = el.querySelector('.note.res');
  if (!n) { n = h('div', { class: 'note res' }); el.append(n); }
  n.className = 'note res ' + (ok ? 'ok' : 'bad');
  n.textContent = ok ? t('sent') : t('failed') + (r.json && r.json.error && r.json.error !== 'closed' ? ' · ' + r.json.error : '');
  if (ok) setTimeout(poll, 800);
}
function askEl(agentId, s) {
  const a = s.ask;
  const can = !!(a.canAnswer && state.features.answer && state.secure && agentId === 'claude' && !(a.sent && (a.sent.state === 'sending' || a.sent.state === 'sent')));
  const card = { sid: s.id, aid: a.id };
  const el = h('div', { class: 'ask', 'data-aid': a.id });
  el.append(h('div', { class: 'q' }, a.question));
  if (a.recap) el.append(h('div', { class: 'recap' }, a.recap));
  const opts = h('div', { class: 'opts' });
  (a.options || []).forEach((o, i) => {
    const disabled = !can || (o.appAction && !o.message);
    opts.append(h('button', { class: 'btn' + (i === 0 ? ' primary' : ''), disabled, onclick: () => doAnswer(card, el, { option: i }) }, o.label));
  });
  opts.append(h('button', { class: 'btn', onclick: async () => { await api('/api/dismiss', { agent: agentId, id: s.id, askId: a.id }); poll(); } }, t('dismiss')));
  el.append(opts);
  if (agentId === 'claude') {
    const input = h('input', { placeholder: t('placeholder'), maxlength: '2000', disabled: !can, enterkeyhint: 'send' });
    if (drafts.has(a.id)) input.value = drafts.get(a.id);
    input.addEventListener('input', () => drafts.set(a.id, input.value));
    const go = () => { if (input.value.trim()) doAnswer(card, el, { custom: input.value }); };
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    el.append(h('div', { class: 'row' }, input, h('button', { class: 'btn primary', disabled: !can, onclick: go }, t('send'))));
  }
  const note = noteFor(a, state.features, state.secure, agentId);
  if (note) el.append(h('div', { class: 'note' }, note));
  return el;
}
// a finished turn nobody has looked at: send a follow-up, or "no reply" (rows without a transcript to open)
function replyEl(agentId, s) {
  const a = s.reply;
  const can = !!(a.canAnswer && state.features.answer && state.secure && agentId === 'claude' && !(a.sent && (a.sent.state === 'sending' || a.sent.state === 'sent')));
  const card = { sid: s.id, aid: a.id, kind: 'reply' };
  const el = h('div', { class: 'ask fin', 'data-aid': a.id });
  el.append(h('div', { class: 'q' }, (s.label || agentName(agentId)) + ' · ' + t('finished')), h('div', { class: 'recap' }, a.text));
  el.append(h('div', { class: 'opts' }, h('button', { class: 'btn', onclick: async () => { await api('/api/dismiss', { agent: agentId, id: s.id }); poll(); } }, t('noReply'))));
  if (agentId === 'claude') {
    const input = h('input', { placeholder: t('replyPlaceholder'), maxlength: '2000', disabled: !can, enterkeyhint: 'send' });
    if (drafts.has(a.id)) input.value = drafts.get(a.id);
    input.addEventListener('input', () => drafts.set(a.id, input.value));
    const go = () => { if (input.value.trim()) doAnswer(card, el, { custom: input.value }); };
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    el.append(h('div', { class: 'row' }, input, h('button', { class: 'btn primary', disabled: !can, onclick: go }, t('send'))));
  }
  const note = noteFor(a, state.features, state.secure, agentId);
  if (note) el.append(h('div', { class: 'note' }, note));
  return el;
}
const sessionOf = (key) => {
  const [agent, id] = String(key).split(':');
  const r = state && (state.rows || []).find((x) => x.id === agent);
  const s = r && r.sessions.find((x) => x.id === id);
  return s ? { r, s } : null;
};

// ------------------------------------------------------------------ home: one list of every conversation
function items() {
  const out = [];
  const seen = new Set();
  const live = new Map();
  for (const r of state.rows || []) for (const s of r.sessions) if (!s.labelKey) live.set(r.id + ':' + s.id, { r, s });
  if (chats && chats.ok) {
    for (const c of chats.chats) {
      const m = live.get(c.key);
      seen.add(c.key);

// ------------------------------------------------------------------ model and thinking choices

// ------------------------------------------------------------------ one conversation
async function openChat(key) {

function syncAsk() {

async function onSendOrStop() {

// ------------------------------------------------------------------ notifications (web push)
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
