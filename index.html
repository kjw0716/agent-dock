<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  :root {
    --bg: rgba(20, 22, 27, .94);
    --line: rgba(255, 255, 255, .08);
    --text: #f2f3f5;
    --muted: #8b919c;
    --working: #5aa9ff;
    --waiting: #ffb020;
    --done: #3ddc97;
    --m: 48px; /* mascot size, set from the window width */
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
  body { font: 13px/1.3 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif; color: var(--text); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  #panel {
    position: fixed; inset: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 20px;
    /* the shadow must fit inside the 12px transparent margin, or the window edge clips it into a dark box */
    box-shadow: 0 2px 7px rgba(0, 0, 0, .35), 0 1px 0 rgba(255, 255, 255, .05) inset;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .top { position: relative; flex: none; height: 30px; display: flex; justify-content: center; align-items: center; -webkit-app-region: drag; }
  .top i { width: 30px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .12); }
  .top .title { position: absolute; left: 14px; font-weight: 600; font-size: 13px; }
  .icon { -webkit-app-region: no-drag; position: absolute; right: 4px; top: 3px; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
  #fit { right: 32px; }
  .icon[hidden] { display: none; }
  .icon:hover { background: rgba(255, 255, 255, .08); color: var(--text); }
  .icon svg { width: 16px; height: 16px; }

  #scroll { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; padding: 0 8px; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .18) transparent; }
  #sizer { position: relative; }
  #app { position: absolute; left: 0; top: 0; transform-origin: 0 0; padding-bottom: 10px; }

  /* resize handles live in the transparent margin around the panel */
  .h { position: fixed; z-index: 5; -webkit-app-region: no-drag; }
  .h.w { left: 0; top: 0; bottom: 0; width: 12px; cursor: ew-resize; }
  .h.e { right: 0; top: 0; bottom: 0; width: 12px; cursor: ew-resize; }
  .hint { position: fixed; right: 15px; top: 50%; width: 4px; height: 18px; margin-top: -9px; opacity: .25; pointer-events: none; z-index: 4; }

  .row { border-radius: 14px; -webkit-app-region: no-drag; }
  .row + .row { margin-top: 2px; }
  .head { display: grid; grid-template-columns: var(--m) 1fr auto; gap: 10px; align-items: center; padding: 8px 10px 8px 6px; border-radius: 14px; }
  .row .head { cursor: pointer; }
  .row .head:hover { background: rgba(255, 255, 255, .05); }
  .row.dim { opacity: .55; }

  /* ---- mascot ---- */
  .bot { position: relative; width: var(--m); height: var(--m); }
  .bot svg { position: absolute; inset: 0; overflow: visible; }
  /* how many sessions of this agent wait for you: a raised hand and the count */
  .bot .hand { position: absolute; right: -4px; bottom: -4px; display: flex; align-items: center; gap: 1px; height: max(17px, calc(var(--m) * .34)); min-width: max(17px, calc(var(--m) * .34)); padding: 0 max(4px, calc(var(--m) * .08)) 0 max(2px, calc(var(--m) * .05)); border-radius: 999px; background: var(--waiting); color: #1a1405; font-weight: 700; font-size: max(10px, calc(var(--m) * .24)); line-height: 1; box-shadow: 0 0 0 2px #14161b; justify-content: center; }
  .bot .hand svg { position: static; width: max(10px, calc(var(--m) * .22)); height: max(10px, calc(var(--m) * .22)); fill: #1a1405; flex: none; }
  .ring { fill: none; stroke-width: 2.5; stroke-linecap: round; transform-origin: 50px 50px; }
  .body-g { transform-origin: 50px 50px; }
  .eye { transform-box: fill-box; transform-origin: center; }
  .check { opacity: 0; }
  .done .check { opacity: 1; }
  .working .ring { stroke: var(--working); stroke-dasharray: 90 190; animation: spin 1.3s linear infinite; }
  .working .body-g { animation: bob 1.6s ease-in-out infinite; }
  .working .eye { animation: blink 3.4s infinite; }
  .waiting .ring { stroke: var(--waiting); animation: pulse 1.3s ease-in-out infinite; }
  .waiting .body-g { animation: ask 1.8s ease-in-out infinite; }
  .waiting .eye { transform: scaleY(1.2); }
  .done .ring { stroke: var(--done); opacity: .55; }
  .done .eye { transform: scaleY(.75); }
  /* done and not looked at yet: the green blinks until you click the row */
  .row.unread.done .ring { animation: blinkgreen 1s ease-in-out infinite; stroke-width: 4; opacity: 1; }
  .row.unread.done .check { animation: pop 1.1s ease-in-out infinite; transform-origin: 84px 84px; }
  .row.unread.done .chip { animation: glowgreen 1.1s ease-in-out infinite; }
  .row.unread .counts .c-done.on { animation: glowgreen 1.1s ease-in-out infinite; }
  .s.unread b { animation: blinkdot 1.1s ease-in-out infinite; }
  .bot .newdot { position: absolute; right: -2px; top: -2px; width: max(9px, calc(var(--m) * .2)); height: max(9px, calc(var(--m) * .2)); border-radius: 50%; background: var(--done); box-shadow: 0 0 0 2px #14161b; animation: blinkdot 1.1s ease-in-out infinite; }
  @keyframes blinkgreen { 0%, 100% { opacity: 1; stroke-width: 5; filter: drop-shadow(0 0 6px rgba(61, 220, 151, .95)); } 50% { opacity: .12; stroke-width: 2; filter: none; } }
  @keyframes pop { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: .55; } }
  @keyframes glowgreen { 0%, 100% { background-color: rgba(61, 220, 151, .13); } 50% { background-color: rgba(61, 220, 151, .38); } }
  @keyframes blinkdot { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes pulse { 0%, 100% { opacity: 1; stroke-width: 2.5; } 50% { opacity: .35; stroke-width: 5; } }
  @keyframes ask { 0%, 100% { transform: scale(1.1) rotate(0); } 25% { transform: scale(1.12) rotate(-3deg); } 75% { transform: scale(1.12) rotate(3deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .name { font-weight: 600; font-size: 14px; display: flex; align-items: baseline; gap: 6px; }
  .name small { font-weight: 500; font-size: 11px; color: var(--muted); }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .main { min-width: 0; }

  .chip { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .working .chip { color: var(--working); background: rgba(90, 169, 255, .14); }
  .waiting .chip { color: var(--waiting); background: rgba(255, 176, 32, .16); }
  .done .chip { color: var(--done); background: rgba(61, 220, 151, .13); }

  /* per-state values */
  .counts { display: none; gap: 5px; margin-top: 5px; }
  .counts span { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: rgba(255, 255, 255, .06); color: var(--muted); white-space: nowrap; }
  .counts .c-working.on { color: var(--working); background: rgba(90, 169, 255, .14); }
  .counts .c-waiting.on { color: var(--waiting); background: rgba(255, 176, 32, .16); }
  .counts .c-done.on { color: var(--done); background: rgba(61, 220, 151, .13); }

  /* ---- sessions ---- */
  .list { padding: 0 10px 8px calc(var(--m) + 16px); display: none; }
  .row.open .list { display: block; }
  .s { display: grid; grid-template-columns: 8px 1fr auto; gap: 8px; align-items: center; padding: 4px 0; font-size: 12px; }
  .s b { width: 8px; height: 8px; border-radius: 50%; }
  .s span:nth-child(2) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s em { font-style: normal; color: var(--muted); }
  .s.working b { background: var(--working); } .s.waiting b { background: var(--waiting); } .s.done b { background: var(--done); opacity: .6; }
  .s.dim { opacity: .5; }
  /* ---- a question waiting for the user ---- */
  .ask { margin: 0 6px 8px 6px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 176, 32, .09); border: 1px solid rgba(255, 176, 32, .25); -webkit-app-region: no-drag; cursor: default; display: none; }
  .m-cozy .ask, .m-full .ask, .m-wide .ask, .row.open .ask { display: block; }
  .ask-q { font-weight: 600; font-size: 13px; line-height: 1.35; user-select: text; }
  .ask-recap { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.35; max-height: 3.9em; overflow: hidden; user-select: text; }
  .ask-opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ask button { font-size: 12px; padding: 5px 11px; border-radius: 8px; background: rgba(255, 255, 255, .1); }
  .ask button:hover:not(:disabled) { background: rgba(255, 255, 255, .18); }
  .ask button:disabled { opacity: .45; cursor: default; }
  .ask button.primary { background: var(--waiting); color: #1a1405; font-weight: 600; }
  .ask-custom { display: flex; gap: 6px; margin-top: 8px; }
  .ask-custom input { flex: 1; min-width: 0; font: inherit; font-size: 12px; color: var(--text); background: rgba(0, 0, 0, .25); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; outline: none; user-select: text; }
  .ask-custom input:focus { border-color: rgba(255, 176, 32, .6); }
  .ask-note { margin-top: 7px; font-size: 11px; color: var(--muted); }
  .ask.fin { background: rgba(61, 220, 151, .07); border-color: rgba(61, 220, 151, .28); }
  .ask.fin .ask-q { font-weight: 600; }
  .ask-recap.full { max-height: 7.2em; }
  .ask-note a { color: var(--text); cursor: pointer; text-decoration: underline; }
  .ask-note.bad { color: #ff9b8f; }
  .ask-note.ok { color: var(--done); }
  .empty { color: var(--muted); text-align: center; padding: 14px 0 18px; }

  /* ---- layouts by available width ---- */
  .m-full .counts, .m-wide .counts { display: flex; }
  .m-wide .list { display: block; }
  .m-wide .name { font-size: 15px; }
  .m-slim .head { grid-template-columns: var(--m) auto; }
  .m-slim .main { display: none; }
  .m-slim .list, .m-icon .list { display: none !important; }
  .m-icon #rows { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 2px; }
  .m-icon .row { width: auto; margin: 0 !important; }
  .m-icon .head { grid-template-columns: var(--m); padding: 3px; }
  .m-icon .main, .m-icon .chip { display: none; }
  .m-icon .top { height: 26px; }
  .m-icon .top i, .m-icon .top .title { display: none; }
  .m-icon .icon { position: static; }
  .m-icon .top { gap: 2px; }
  .m-icon .top { -webkit-app-region: drag; }
  .m-icon .empty { padding: 8px 0 12px; font-size: 11px; }
  .m-icon #app { padding-bottom: 8px; }
  .m-icon #scroll { padding: 0 4px; }
  .m-slim .chip { font-size: 11px; padding: 3px 8px; }

  /* ---- settings ---- */
  .sect { color: var(--muted); font-size: 11px; padding: 8px 10px 4px; }
  .opt { -webkit-app-region: no-drag; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 12px; min-height: 42px; }
  .opt:hover { background: rgba(255, 255, 255, .04); }
  .opt .bot { --m: 30px; }
  .opt .t { font-weight: 600; }
  .opt .d { color: var(--muted); font-size: 11px; margin-top: 1px; }
  .opt.off .bot { opacity: .35; filter: grayscale(.8); }
  .opt.missing .t { color: var(--muted); }
  .opt.plain { grid-template-columns: 1fr auto; }
  .toggle { width: 38px; height: 22px; border-radius: 11px; background: rgba(255, 255, 255, .16); position: relative; transition: background .15s; }
  .toggle::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .toggle.on { background: var(--done); }
  .toggle.on::after { transform: translateX(16px); }
  .segs { display: flex; background: rgba(255, 255, 255, .08); border-radius: 9px; padding: 2px; gap: 2px; }
  .seg { padding: 4px 10px; border-radius: 7px; font-size: 12px; color: var(--muted); }
  .seg.on { background: rgba(255, 255, 255, .16); color: var(--text); }
  .btns { display: flex; gap: 8px; padding: 8px 10px 0; -webkit-app-region: no-drag; }
  .btns button { flex: 1; padding: 8px 0; border-radius: 10px; background: rgba(255, 255, 255, .07); font-size: 12px; }
  .btns button:hover { background: rgba(255, 255, 255, .12); }
  .btns .quit { color: #ff7b72; }
</style>
</head>
<body>
<div id="panel">
  <div class="top"><span class="title" id="title" hidden></span><i></i>
    <button class="icon" id="fit"></button>
    <button class="icon" id="toggle"></button></div>
  <div id="scroll"><div id="sizer"><div id="app"><div id="rows"></div></div></div></div>
</div>
<div class="h w" data-d="w"></div><div class="h e" data-d="e"></div>
<svg class="hint" viewBox="0 0 4 18"><path d="M1 2v14M3.4 2v14" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></svg>
<script>
const I18N = {
  en: {
    working: 'Working', waiting: 'Waiting', done: 'Done', empty: 'No agents running',
    settings: 'Settings', back: 'Back', agents: 'Agents shown', general: 'General',
    onTop: 'Always on top', autostart: 'Launch at login', language: 'Language',
    reset: 'Reset position & size', quit: 'Quit', none: 'No sessions', missing: 'Not found',
    expandAll: 'Expand all', collapseAll: 'Collapse and restore size',
    open: 'Running', recent: 'Recently active', session: 'Session',
    finished: 'finished', openChat: 'Open chat', noReply: 'No reply', replyPlaceholder: 'Reply to the agent…', moreUnread: (n) => n + ' more unread', dismissAll: 'Dismiss all', jumpOnClick: 'Open the chat when I click it',
    askPlaceholder: 'Type an answer…', send: 'Send', sending: 'Sending…', sentOk: 'Sent', failed: 'Not sent', answerFromDock: 'Answer from the dock', pluginOn: 'Claude plugin', pluginInstalled: (n) => (n ? 'Installed · ' + n + (n === 1 ? ' session' : ' sessions') + ' ready' : 'Installed · start a new session to use it'), pluginOff: 'Not installed', installing: 'Working…',
    noteNotInstalled: 'Turn on Answer from the dock in Settings to reply here.', noteNotLoaded: 'This session started before the plugin was installed. Start a new session to reply here.', appOnly: 'Runs inside the Claude app',

    settings: '设置', back: '返回', agents: '显示的 Agent', general: '通用',
    onTop: '置顶显示', autostart: '开机自启', language: '语言',
    reset: '重置位置与大小', quit: '退出', none: '没有会话', missing: '未找到',
    expandAll: '展开全部', collapseAll: '收起并还原大小',
    open: '运行中', recent: '最近活动', session: '会话',
    finished: '已完成', openChat: '打开聊天', noReply: '不回复', replyPlaceholder: '给 Agent 回复…', moreUnread: (n) => '还有 ' + n + ' 个未读', dismissAll: '全部忽略', jumpOnClick: '点一下就打开对应的聊天',
    askPlaceholder: '输入回答…', send: '发送', sending: '发送中…', sentOk: '已发送', failed: '未发送', answerFromDock: '在窗口里回答', pluginOn: 'Claude 插件', pluginInstalled: (n) => (n ? '已安装 · ' + n + ' 个会话可用' : '已安装 · 新开会话后可用'), pluginOff: '未安装', installing: '处理中…',

    now: '刚刚', lessMin: '不到 1 分钟',
    sessions: (n) => n + ' 个会话',
    min: (n) => n + ' 分钟', hour: (n) => n + ' 小时', minAgo: (n) => n + ' 分钟前', hourAgo: (n) => n + ' 小时前',
  },
};
let lang = 'en'; // English is the default; Settings can switch to Chinese
const t = (k, n) => {
  const v = (I18N[lang] || I18N.en)[k];
  return typeof v === 'function' ? v(n) : v;
};
const ICON_SET = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h6M12 4h2M2 12h2M8 12h6M2 8h10"/><circle cx="10" cy="4" r="1.6"/><circle cx="6" cy="12" r="1.6"/></svg>';
const ICON_BACK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>';
const ICON_FIT = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6V3h3M13 6V3h-3M3 10v3h3M13 10v3h-3"/></svg>';
const ICON_UNFIT = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v3H3M10 3v3h3M6 13v-3H3M10 13v-3h3"/></svg>';
let wasExpanded = false; // whether any row is open (the window grows while one is)
const open = new Set();
let rows = [];
let view = 'status';
let settings = null;
let jumpOn = true; // a click opens the chat (Settings)
const JUMP = { claude: true, opencode: true }; // agents whose app the dock can open
let pluginWorking = false;
let pluginError = '';
let zoom = 1;

/* ------------------------------------------------------------------ mascots
   One bot per agent: its signature silhouette and colour, two eyes, rosy cheeks
   and an eye glint (my own small twist). Drawn here; nothing is copied. */
function blob(n, amp, r = 30, cy = 50) {
  let d = '';
  for (let i = 0; i <= 72; i++) {
    const t = (i / 72) * Math.PI * 2;
    const k = r * (1 + amp * Math.cos(n * t));
    d += (i ? 'L' : 'M') + (50 + k * Math.cos(t)).toFixed(1) + ' ' + (cy + k * Math.sin(t)).toFixed(1);
  }
  return d + 'Z';
}
const LIGHT = '#f4f5f8';
const DARK = '#14161b';
const SPEC = {
  claude: { c: ['#ee8b6e', '#d4623f'], body: (f) => `<path d="${blob(10, 0.075)}" fill="${f}"/>` },
  codex: { c: ['#3fcfa3', '#1b9c75'], body: (f) => `<path d="${blob(5, 0.09)}" fill="${f}"/>` },
  opencode: { c: ['#565b68', '#2b2f36'], eye: LIGHT, body: (f) => `<rect x="22" y="32" width="56" height="46" rx="7" fill="${f}"/><g fill="#b9bcc4"><rect x="22" y="20" width="14" height="16" rx="3"/><rect x="43" y="20" width="14" height="16" rx="3"/><rect x="64" y="20" width="14" height="16" rx="3"/></g>`, ey: 56 },
  kilo: { c: ['#ffe066', '#f2b705'], body: (f) => `<rect x="20" y="20" width="60" height="60" rx="20" fill="${f}"/>` },
  mimo: { c: ['#ff8a4c', '#f05a1a'], body: (f) => `<rect x="20" y="22" width="60" height="58" rx="22" fill="${f}"/><circle cx="32" cy="20" r="7" fill="${f}"/><circle cx="68" cy="20" r="7" fill="${f}"/>` },
  cursor: { c: ['#4a4b52', '#1f2024'], eye: LIGHT, body: (f) => `<polygon points="50,18 77,34 77,66 50,82 23,66 23,34" fill="${f}" stroke="${f}" stroke-width="8" stroke-linejoin="round"/>` },
  copilot: { c: ['#ffffff', '#d4d8e2'], goggles: true, body: (f) => `<circle cx="50" cy="52" r="29" fill="${f}"/><rect x="17" y="38" width="66" height="26" rx="13" fill="#1f2126"/><circle cx="37" cy="51" r="9.5" fill="#fff"/><circle cx="63" cy="51" r="9.5" fill="#fff"/><circle cx="38" cy="52" r="4.2" fill="${DARK}" class="eye"/><circle cx="64" cy="52" r="4.2" fill="${DARK}" class="eye"/>` },
  gemini: { c: ['#6aa5ff', '#a07bff'], body: (f) => `<path d="M50 14C54 38 62 46 86 50C62 54 54 62 50 86C46 62 38 54 14 50C38 46 46 38 50 14Z" fill="${f}" stroke="${f}" stroke-width="6" stroke-linejoin="round"/>`, small: true },
  antigravity: { c: ['#4285f4', '#ea4335', '#fbbc05', '#34a853'], body: (f) => `<path d="M20 72Q20 20 50 20Q80 20 80 72Q80 80 70 80L30 80Q20 80 20 72Z" fill="${f}"/>`, ey: 52 },
  grok: { c: ['#34343a', '#0f0f12'], eye: LIGHT, body: (f) => `<ellipse cx="50" cy="52" rx="42" ry="11" transform="rotate(-18 50 50)" fill="none" stroke="#c9ccd6" stroke-width="3.4"/><circle cx="50" cy="50" r="26" fill="${f}"/><path d="M8 52A42 11 0 0 0 92 52" transform="rotate(-18 50 50)" fill="none" stroke="#c9ccd6" stroke-width="3.4"/>` },
  deepseek: { c: ['#6b83ff', '#3d58ee'], smile: true, body: (f) => `<path d="${blob(6, 0.045)}" fill="${f}"/>` },
  kimi: { c: ['#3a3a42', '#16171b'], eye: LIGHT, body: (f) => `<rect x="20" y="26" width="60" height="54" rx="24" fill="${f}"/><circle cx="76" cy="24" r="7" fill="#4c8dff"/>`, ey: 54 },
  pi: { c: ['#3a3c44', '#16171b'], eye: LIGHT, body: (f) => `<rect x="18" y="24" width="64" height="18" rx="6" fill="${f}"/><rect x="28" y="38" width="15" height="40" rx="6" fill="${f}"/><rect x="57" y="38" width="15" height="40" rx="6" fill="${f}"/>`, ey: 33, ed: 12, eh: 10, nocheek: true },
  omp: { c: ['#9b7cf8', '#5a3fd1'], body: (f) => `<rect x="18" y="24" width="64" height="18" rx="6" fill="${f}"/><rect x="28" y="38" width="15" height="40" rx="6" fill="${f}"/><rect x="57" y="38" width="15" height="40" rx="6" fill="${f}"/>`, ey: 33, ed: 12, eh: 10, nocheek: true },
  openclaw: { c: ['#ff6a5f', '#d92b2b'], body: (f) => `<g stroke="${f}" stroke-width="4" stroke-linecap="round"><path d="M38 30L30 12M62 30L70 12"/></g><circle cx="30" cy="11" r="4.5" fill="${f}"/><circle cx="70" cy="11" r="4.5" fill="${f}"/><circle cx="50" cy="54" r="28" fill="${f}"/>`, ey: 54 },
  hermes: { c: ['#3a3d45', '#1c1e23'], eye: LIGHT, body: (f) => `<circle cx="50" cy="52" r="29" fill="${f}"/><path d="M22 46A28 28 0 0 1 78 46Q64 40 50 46Q36 52 22 46Z" fill="#8d929c"/>`, ey: 58 },
  droid: { c: ['#ff9a4d', '#e8611a'], body: (f) => `<polygon points="50,18 77,34 77,66 50,82 23,66 23,34" fill="${f}" stroke="${f}" stroke-width="8" stroke-linejoin="round"/>` },
  trae: { c: ['#4be19b', '#16a870'], body: (f) => `<rect x="20" y="20" width="60" height="60" rx="18" fill="${f}"/>` },
  qoder: { c: ['#2a2d33', '#2fd36f'], eye: LIGHT, body: () => `<path d="M20 52A30 30 0 0 1 80 52Z" fill="#2a2d33"/><path d="M20 52A30 30 0 0 0 80 52Z" fill="#2fd36f"/>`, ey: 44 },
  zcode: { c: ['#44464e', '#1d1e22'], eye: LIGHT, body: (f) => `<polygon points="36,24 84,24 64,76 16,76" fill="${f}" stroke="${f}" stroke-width="8" stroke-linejoin="round"/>`, ex: 50 },
  codebuddy: { c: ['#5b8cff', '#8f6bff'], body: (f) => `<path d="M24 42L28 14L47 32ZM76 42L72 14L53 32Z" fill="${f}" stroke="${f}" stroke-width="4" stroke-linejoin="round"/><rect x="20" y="28" width="60" height="52" rx="24" fill="${f}"/>`, ey: 54 },
  workbuddy: { c: ['#35d98e', '#12a869'], body: (f) => `<path d="M24 42L28 14L47 32ZM76 42L72 14L53 32Z" fill="${f}" stroke="${f}" stroke-width="4" stroke-linejoin="round"/><rect x="20" y="28" width="60" height="52" rx="24" fill="${f}"/>`, ey: 54 },
  qwen: { c: ['#8b7bff', '#5b45e0'], body: (f) => `<path d="${blob(6, 0.07)}" fill="${f}"/>` },
  devin: { c: ['#3ed9c4', '#12a89a'], body: (f) => `<path d="${blob(4, 0.07)}" fill="${f}"/>` },
  cline: { c: ['#a98bff', '#6a47e8'], body: (f) => `<path d="M50 24V12" stroke="${f}" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="11" r="4.5" fill="${f}"/><rect x="20" y="24" width="60" height="56" rx="20" fill="${f}"/>` },
  roo: { c: ['#b890ff', '#7e4fe0'], body: (f) => `<ellipse cx="33" cy="22" rx="7" ry="15" transform="rotate(-12 33 22)" fill="${f}"/><ellipse cx="67" cy="22" rx="7" ry="15" transform="rotate(12 67 22)" fill="${f}"/><circle cx="50" cy="56" r="27" fill="${f}"/>`, ey: 56 },
  goose: { c: ['#ffffff', '#d3d8e2'], body: (f) => `<circle cx="46" cy="54" r="27" fill="${f}"/><polygon points="68,54 90,60 68,66" fill="#ff9f43"/>`, ex: 46 },
};
const FALLBACK = { c: ['#a3a9b5', '#7b818c'], body: (f) => `<circle cx="50" cy="50" r="30" fill="${f}"/>` };

const HAND = '<svg viewBox="0 0 24 24"><rect x="6" y="11" width="12" height="9" rx="4"/><rect x="6" y="5" width="2.7" height="10" rx="1.35"/><rect x="9.4" y="2.5" width="2.7" height="12" rx="1.35"/><rect x="12.9" y="3" width="2.7" height="11.5" rx="1.35"/><rect x="16.3" y="5" width="2.7" height="10" rx="1.35"/><rect x="2.6" y="11.5" width="2.7" height="6.5" rx="1.35" transform="rotate(-32 4 14)"/></svg>';
function mascot(id, state, waiting = 0, fresh = false) {
  const sp = SPEC[id] || FALLBACK;
  const gid = 'g' + id + Math.random().toString(36).slice(2, 6);
  const stops = sp.c.map((c, i) => `<stop offset="${(i / (sp.c.length - 1 || 1)).toFixed(2)}" stop-color="${c}"/>`).join('');
  const dir = sp.c.length > 2 ? 'x1="0" y1="0" x2="1" y2="0"' : 'x1="0.2" y1="0" x2="0.8" y2="1"';
  const ey = sp.ey || 50, ex = sp.ex || 50, ed = sp.ed || 9.5, eh = sp.eh || (sp.small ? 10 : 16), ew = sp.small ? 6 : 8;
  const col = sp.eye || DARK;
  let face = '';
  if (!sp.goggles) {
    const eye = (cx) => sp.smile
      ? `<path class="eye" d="M${cx - 5} ${ey + 3}Q${cx} ${ey - 5} ${cx + 5} ${ey + 3}" fill="none" stroke="${col}" stroke-width="3.4" stroke-linecap="round"/>`
      : `<rect class="eye" x="${cx - ew / 2}" y="${ey - eh / 2}" width="${ew}" height="${eh}" rx="${ew / 2}" fill="${col}"/><circle cx="${cx + 1.4}" cy="${ey - eh / 2 + 3}" r="1.7" fill="#fff" opacity=".9"/>`;
    face = eye(ex - ed) + eye(ex + ed);
    if (!sp.nocheek) face += `<ellipse cx="${ex - ed - 8}" cy="${ey + eh / 2 + 2}" rx="4.6" ry="3" fill="#ff7a9a" opacity=".4"/><ellipse cx="${ex + ed + 8}" cy="${ey + eh / 2 + 2}" rx="4.6" ry="3" fill="#ff7a9a" opacity=".4"/>`;
  }
  return `<div class="bot"><svg viewBox="0 0 100 100">
    <defs><linearGradient id="${gid}" ${dir}>${stops}</linearGradient></defs>
    <circle class="ring" cx="50" cy="50" r="47"/>
    <g class="body-g">${sp.body('url(#' + gid + ')')}${face}</g>
    <g class="check"><circle cx="84" cy="84" r="13" fill="#14161b"/><circle cx="84" cy="84" r="10" fill="#3ddc97"/>
      <path d="M79 84.5l3.6 3.6 6.4-7.2" fill="none" stroke="#10241b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
  </svg>${fresh ? '<div class="newdot"></div>' : ''}${waiting > 0 ? `<div class="hand" title="${esc(t('waiting'))} ${waiting}">${HAND}<span>${waiting}</span></div>` : ''}</div>`;
}

/* ------------------------------------------------------------------ views */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function when(state, since) {
  const m = Math.max(0, Math.floor((Date.now() - since) / 60000));
  if (state === 'done') return m < 1 ? t('now') : m < 60 ? t('minAgo', m) : t('hourAgo', Math.floor(m / 60));
  return m < 1 ? t('lessMin') : m < 60 ? t('min', m) : t('hour', Math.floor(m / 60));
}
const lbl = (s) => (s.labelKey ? t(s.labelKey) : s.label || t('session'));
const stamp = (s) => `<span class="when" data-state="${s.state}" data-since="${s.since}">${when(s.state, s.since)}</span>`;
const countOf = (r, st) => r.sessions.filter((s) => s.state === st).length;

function renderStatus(el) {
  if (!rows.length) {
    el.innerHTML = '<div class="empty">' + t('empty') + '</div>';
    return;
  }
  el.innerHTML = rows.map((r) => {
    const multi = r.sessions.length > 1;
    const list = r.sessions.map((s) =>
      `<div class="s ${s.state}${s.dim ? ' dim' : ''}${s.unread ? ' unread' : ''}" data-agent="${r.id}" data-sid="${esc(s.id)}"><b></b><span>${esc(lbl(s))}</span><em>${t(s.state)} · ${stamp(s)}</em></div>`).join('');
    const counts = ['working', 'waiting', 'done'].map((st) => {
      const n = countOf(r, st);
      return `<span class="c-${st}${n ? ' on' : ''}">${t(st)} ${n}</span>`;
    }).join('');
    return `<div class="row ${r.state}${r.sessions.some((x) => x.unread) ? ' unread' : ''}${r.top.dim ? ' dim' : ''}${multi ? ' multi' : ''}${open.has(r.id) ? ' open' : ''}" data-id="${r.id}" title="${esc(r.name)} · ${t(r.state)}">
      <div class="head">${mascot(r.id, r.state, countOf(r, 'waiting'), r.state !== 'done' && r.sessions.some((x) => x.unread))}
        <div class="main"><div class="name">${esc(r.name)}${multi ? `<small>${r.sessions.length}</small>` : ''}</div><div class="sub">${esc(lbl(r.top))} · ${stamp(r.top)}</div><div class="counts">${counts}</div></div>
        <div class="chip">${t(r.state)}</div></div>
      ${r.sessions.filter((x) => x.ask).slice(0, 2).map(askCard).join('')}${replyCards(r)}
      <div class="list">${list}</div></div>`;
  }).join('');
  restoreDrafts();
}


/* ---- a question waiting for the user (a next-step box of the Claude desktop app) ---- */
const drafts = new Map(); // "sessionId|askId" -> text typed so far, kept across redraws
let focused = null; // the draft key whose input had the focus
const draftKey = (sid, aid) => sid + '|' + aid;
function askNote(a) {
  if (a.sent) {
    if (a.sent.state === 'sending') return `<div class="ask-note">${t('sending')}</div>`;
    if (a.sent.state === 'sent') return `<div class="ask-note ok">${t('sentOk')}</div>`;
    if (a.sent.state === 'failed') return `<div class="ask-note bad">${t('failed')}${a.sent.reason ? ' · ' + esc(String(a.sent.reason).slice(0, 80)) : ''}</div>`;
  }
  if (a.note === 'not-installed') return `<div class="ask-note">${t('noteNotInstalled')}</div>`;
  if (a.note === 'not-loaded') return `<div class="ask-note">${t('noteNotLoaded')}</div>`;
  return '';
}
function askCard(s) {
  const a = s.ask;
  const busy = a.sent && (a.sent.state === 'sending' || a.sent.state === 'sent');
  const can = a.canAnswer && !busy;
  const opts = a.options.map((o, i) => {
    const appOnly = o.appAction && !o.message;
    return `<button class="${i === 0 && !appOnly ? 'primary' : ''}" data-opt="${i}" ${can && !appOnly ? '' : 'disabled'} title="${appOnly ? esc(t('appOnly')) : ''}">${esc(o.label)}</button>`;
  }).join('');
  const key = draftKey(s.id, a.id);
  return `<div class="ask" data-agent="claude" data-sid="${esc(s.id)}" data-aid="${esc(a.id)}">
    <div class="ask-q">${esc(a.question)}</div>${a.recap ? `<div class="ask-recap">${esc(a.recap)}</div>` : ''}
    <div class="ask-opts">${opts}${JUMP.claude ? `<button data-open>${t('openChat')}</button>` : ''}</div>
    <div class="ask-custom"><input data-key="${esc(key)}" placeholder="${esc(t('askPlaceholder'))}" maxlength="2000" ${can ? '' : 'disabled'}><button data-send ${can ? '' : 'disabled'}>${t('send')}</button></div>
    ${askNote(a)}</div>`;
}
function restoreDrafts() {
  document.querySelectorAll('.ask-custom input').forEach((el) => {
    const v = drafts.get(el.dataset.key);
    if (v) el.value = v;
    if (focused === el.dataset.key && !el.disabled) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  });
}
async function sendAnswer(card, body) {
  if (card.dataset.busy) return; // one answer per question: a double click or Enter after Send must not send twice
  card.dataset.busy = '1';
  card.querySelectorAll('button, input').forEach((el) => { el.disabled = true; });
  const res = await window.hud.answer({ sessionId: card.dataset.sid, askId: card.dataset.aid, ...(card.dataset.kind === 'reply' ? { kind: 'reply' } : {}), ...body });
  if (!res.ok) {
    delete card.dataset.busy; // let the user try again
    card.querySelectorAll('button, input').forEach((el) => { el.disabled = false; });
    const note = card.querySelector('.ask-note') || card.appendChild(Object.assign(document.createElement('div'), { className: 'ask-note' }));
    note.className = 'ask-note bad';
    note.textContent = t('failed') + (res.error && res.error !== 'closed' ? ' · ' + res.error : '');
  } else {
    drafts.delete(draftKey(card.dataset.sid, card.dataset.aid));
  }
}


/* ---- the brief reply of a finished turn: read it, open the chat, dismiss it, or answer right here ---- */
function replyCards(r) {
  const list = r.sessions.filter((x) => x.unread && x.reply && !x.ask).sort((a, b) => (b.reply.at || 0) - (a.reply.at || 0));
  const more = list.length > 3 ? `<div class="ask-note">${t('moreUnread', list.length - 3)} · <a data-readall="${r.id}">${t('dismissAll')}</a></div>` : '';
  return list.slice(0, 3).map((x) => replyCard(r, x)).join('') + more;
}
function replyCard(r, s) {
  const a = s.reply;
  const busy = a.sent && (a.sent.state === 'sending' || a.sent.state === 'sent');
  const can = a.canAnswer && !busy;
  const input = r.id === 'claude'
    ? `<div class="ask-custom"><input data-key="${esc(draftKey(s.id, a.id))}" placeholder="${esc(t('replyPlaceholder'))}" maxlength="2000" ${can ? '' : 'disabled'}><button data-send ${can ? '' : 'disabled'}>${t('send')}</button></div>`
    : '';
  const open = JUMP[r.id] ? `<button data-open>${t('openChat')}</button>` : '';
  return `<div class="ask fin" data-kind="reply" data-agent="${r.id}" data-sid="${esc(s.id)}" data-aid="${esc(a.id)}">
    <div class="ask-q">${esc(lbl(s))} · ${t('finished')}</div>
    <div class="ask-recap full">${esc(a.text)}</div>
    <div class="ask-opts">${open}<button data-dismiss>${t('noReply')}</button></div>
    ${input}${askNote(a)}</div>`;
}

function renderSettings(el) {
  if (!settings) { el.innerHTML = ''; return; }
  const sw = (on) => `<div class="toggle${on ? ' on' : ''}"></div>`;
  const agent = (a) => `<div class="opt${a.on ? '' : ' off'}${a.found ? '' : ' missing'}" data-agent="${a.id}">${mascot(a.id, 'static')}
    <div><div class="t">${esc(a.name)}</div><div class="d">${a.found ? (a.count ? t('sessions', a.count) : t('none')) : t('missing')}</div></div>${sw(a.on)}</div>`;
  const seg = (code, name) => `<button class="seg${settings.lang === code ? ' on' : ''}" data-lang="${code}">${name}</button>`;
  el.innerHTML = `<div class="sect">${t('answerFromDock')}</div>
    <div class="opt plain" data-plugin="1"><div><div class="t">${t('pluginOn')}</div><div class="d">${settings.plugin.busy || pluginWorking ? t('installing') : settings.plugin.installed ? t('pluginInstalled', settings.plugin.loaded) : t('pluginOff')}</div>${pluginError ? `<div class="d" style="color:#ff9b8f">${esc(pluginError)}</div>` : ''}</div>${sw(settings.plugin.installed)}</div>
    <div class="sect">${t('agents')}</div>${settings.agents.map(agent).join('')}
    <div class="opt plain" data-opt="onTop"><div class="t">${t('onTop')}</div>${sw(settings.onTop)}</div>
    <div class="opt plain" data-opt="autostart"><div class="t">${t('autostart')}</div>${sw(settings.autostart)}</div>
    <div class="opt plain" data-opt="jump"><div class="t">${t('jumpOnClick')}</div>${sw(settings.jump)}</div>
    <div class="sect">${t('general')}</div>
    <div class="opt plain"><div class="t">${t('language')}</div><div class="segs">${seg('en', 'English')}${seg('zh', '中文')}</div></div>
    <div class="btns"><button data-act="reset">${t('reset')}</button><button class="quit" data-act="quit">${t('quit')}</button></div>`;
}

/* ----------------------------------------------------------------- layout
   Content scales gently with the window width and switches layout by the width
   it actually has: icons only → icon + status → full row → full row with values. */
function layout() {
  const W = window.innerWidth;
  zoom = W < 200 ? 1 : Math.min(1.6, Math.max(0.8, 1 + (W - 312) / 600));
  const inner = (W - 24 - 16 - 4) / zoom; // panel minus scroll padding and border
  const mode = inner < 96 ? 'icon' : inner < 190 ? 'slim' : inner < 250 ? 'cozy' : inner < 360 ? 'full' : 'wide';
  const app = document.getElementById('app');
  const panel = document.getElementById('panel');
  panel.className = 'm-' + mode;
  const mascotPx = Math.max(30, Math.min(mode === 'icon' ? 60 : 84, Math.round(mode === 'icon' ? inner * 0.74 : inner * 0.17)));
  document.documentElement.style.setProperty('--m', mascotPx + 'px');
  app.style.width = inner + 'px';
  app.style.transform = `scale(${zoom})`;
  const sizer = document.getElementById('sizer');
  sizer.style.height = Math.ceil(app.offsetHeight * zoom) + 'px';
  // natural window height for the main process (it only uses it until the user sizes the window)
  window.hud.size(document.querySelector('.top').offsetHeight + app.offsetHeight * zoom + 8);
}

function render() {
  const el = document.getElementById('rows');
  const inSettings = view === 'settings';
  const title = document.getElementById('title');
  title.hidden = !inSettings;
  title.textContent = t('settings');
  const btn = document.getElementById('toggle');
  btn.innerHTML = inSettings ? ICON_BACK : ICON_SET;
  btn.title = inSettings ? t('back') : t('settings');
  const fb = document.getElementById('fit');
  fb.innerHTML = open.size ? ICON_UNFIT : ICON_FIT;
  fb.title = open.size ? t('collapseAll') : t('expandAll');
  fb.hidden = inSettings;
  inSettings ? renderSettings(el) : renderStatus(el);
  layout();
}

function refreshTimes() {
  document.querySelectorAll('.when').forEach((n) => { n.textContent = when(n.dataset.state, Number(n.dataset.since)); });
}

// The window grows while any row is open and goes back to its exact previous size when the
// last one closes. Only the 0 <-> some transitions are sent, so a manual resize is respected.
function syncExpanded(force) {
  const now = open.size > 0;
  if (force || now !== wasExpanded) { wasExpanded = now; window.hud.expand(now); } // main ignores a repeat
}
document.getElementById('fit').addEventListener('click', () => {
  if (open.size) open.clear(); else rows.forEach((r) => open.add(r.id));
  syncExpanded(true);
  render();
});

document.getElementById('toggle').addEventListener('click', async () => {
  view = view === 'settings' ? 'status' : 'settings';
  if (view === 'settings') settings = await window.hud.getSettings();
  render();
});

document.getElementById('rows').addEventListener('input', (e) => {
  if (e.target.matches('.ask-custom input')) drafts.set(e.target.dataset.key, e.target.value);
});
document.getElementById('rows').addEventListener('focusin', (e) => { focused = e.target.matches('.ask-custom input') ? e.target.dataset.key : null; });
document.getElementById('rows').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('.ask-custom input') && e.target.value.trim()) {
    const card = e.target.closest('.ask');
    sendAnswer(card, { custom: e.target.value });
  }
});
document.getElementById('rows').addEventListener('click', async (e) => {
  const card = e.target.closest('.ask');
  if (card) {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    if (b.hasAttribute('data-open')) { window.hud.openChat(card.dataset.agent, card.dataset.sid); return; }
    if (b.hasAttribute('data-dismiss')) { window.hud.dismiss(card.dataset.agent, card.dataset.sid); return; }
    if (b.dataset.opt !== undefined) sendAnswer(card, { option: Number(b.dataset.opt) });
    else if (b.hasAttribute('data-send')) {
      const input = card.querySelector('input');
      if (input.value.trim()) sendAnswer(card, { custom: input.value });
    }
    return; // clicks inside a question never open or close the row
  }
  if (view === 'settings') {
    if (e.target.closest('[data-plugin]')) {
      if (pluginWorking) return;
      pluginWorking = true;
      pluginError = '';
      render();
      const r = await window.hud.setPlugin(!settings.plugin.installed);
      pluginWorking = false;
      if (!r.ok) pluginError = (r.step ? r.step + ': ' : '') + (r.error || 'failed');
      settings = await window.hud.getSettings();
      render();
      return;
    }
    const a = e.target.closest('[data-agent]');
    const o = e.target.closest('[data-opt]');
    const b = e.target.closest('[data-act]');
    const g = e.target.closest('[data-lang]');
    if (g) {
      settings = await window.hud.setSettings({ lang: g.dataset.lang });
    } else if (a) {
      const cur = settings.agents.find((x) => x.id === a.dataset.agent);
      settings = await window.hud.setSettings({ agent: { id: cur.id, on: !cur.on } });
    } else if (o) {
      settings = await window.hud.setSettings({ [o.dataset.opt]: !settings[o.dataset.opt] });
    } else if (b) {
      settings = await window.hud.setSettings({ [b.dataset.act]: true });
    } else return;
    lang = settings.lang;
    jumpOn = settings.jump;
    render();
    return;
  }
  const readAll = e.target.closest('[data-readall]');
  if (readAll) { window.hud.markRead(readAll.dataset.readall); return; }
  const line = e.target.closest('.s[data-sid]');
  if (line && jumpOn && JUMP[line.dataset.agent]) { window.hud.openChat(line.dataset.agent, line.dataset.sid); return; }
  const row = e.target.closest('.row');
  if (!row) return;
  const id = row.dataset.id;
  const only = rows.find((x) => x.id === id);
  if (jumpOn && JUMP[id] && only && only.sessions.length === 1) { window.hud.openChat(id, only.sessions[0].id); return; } // one session: go straight to it
  if (row.classList.contains('unread')) window.hud.markRead(id); // looking at it counts as reading it
  open.has(id) ? open.delete(id) : open.add(id);
  syncExpanded(true); // a click always re-asserts it, even after a manual width drag
  render();
});

// Resize the width from the left or right edge: the main process follows the cursor.
const stop = () => window.hud.resize('', false);
document.querySelectorAll('.h').forEach((h) => {
  h.addEventListener('pointerdown', (e) => { h.setPointerCapture(e.pointerId); window.hud.resize(h.dataset.d, true); });
  h.addEventListener('pointerup', stop);
  h.addEventListener('pointercancel', stop);
  h.addEventListener('lostpointercapture', stop);
});
window.addEventListener('resize', layout);

window.hud.onRows((r) => {
  rows = r;
  for (const id of [...open]) if (!rows.some((x) => x.id === id)) open.delete(id);
  syncExpanded();
  if (view === 'status') render();
});
setInterval(refreshTimes, 15000);
(async () => {
  settings = await window.hud.getSettings();
  lang = settings.lang;
  jumpOn = settings.jump;
  render();
  window.hud.ready();
})();
</script>
